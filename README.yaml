description: |-
  This module sets up AWS SSM Session Manager and Fleet Manager settings, including S3 bucket for audit logs, CloudWatch Log Group, KMS encryption for both, Default Host Management Configuration, Inventory collection, resource data sync, just-in-time node access and Remote Desktop connection recording. It also drives SSM Quick Setup configuration managers for Default Host Management, Host Management and Patch Policy, across a single account or a set of organizational units.

# Introduction to the project
introduction: |-
  The AWS SSM Session Management module provides a standardized way to configure Session Manager across an organization.
  It ensures that all sessions are logged to a secure S3 bucket and optionally to CloudWatch Logs, with all data encrypted using a KMS key.

  The module creates a regional `SSM-SessionManagerRunShell` Session document holding the Session Manager
  preferences, an encrypted S3 bucket with a tiered lifecycle policy for audit logs, an optional CloudWatch
  log group, and the KMS key protecting both. Access to those audit logs is granted in two tiers:
  `settings.allowed_iam_role_names` (or `allowed_iam_role_arns`) grants the write-only pair that the
  instance roles writing session logs need, while `settings.admin_iam_role_names` grants full object
  access — read, create, delete, multipart and listing — for roles that have to review or clean up the
  logs. A third list, `settings.create_grant_iam_role_names`, touches only the KMS key: it grants
  `kms:CreateGrant` to the roles that need to hand the key
  to another AWS service on their behalf, such as an operator starting a recorded Remote Desktop
  connection. All three name lists accept exact names and
  `*` / `?` wildcards, resolved at plan time, and each has an ARN counterpart —
  `settings.allowed_iam_role_arns`, `settings.admin_iam_role_arns` and
  `settings.create_grant_iam_role_arns` — for roles outside this account that
  cannot be looked up by name.

  Under `settings.fleet_manager` the module configures regional Fleet Manager features, the unified
  Systems Manager console, and just-in-time node access. The console and JIT support single-account
  and organizational deployments.

  - **Default Host Management Configuration** creates the service role Systems Manager assumes and flips
    the `/ssm/managed-instance/default-ec2-instance-management-role` service setting, so every EC2
    instance in the account and Region becomes a managed node without an instance profile. The role is
    also granted write access to this module's audit bucket, KMS key and log group, so nodes adopted this
    way can log their sessions without further configuration.
  - **Inventory collection** creates the `AWS-GatherSoftwareInventory` association that populates the
    Fleet Manager node detail views.
  - **Resource data sync** aggregates that Inventory into S3 for querying with Athena, defaulting to the
    audit bucket this module already manages and adding the bucket policy and KMS grants the service
    requires.

  - **The unified Systems Manager console** uses Quick Setup to aggregate managed nodes across the
    configured scope.
  - **Just-in-time node access** uses Quick Setup to enable access requests for managed nodes. It can
    be enabled independently of Remote Desktop recording.
  - **Remote Desktop connection recording** records approved Fleet Manager RDP connections to S3. The
    audit bucket uses `BucketOwnerEnforced` so its owner also owns the recordings.

  The `awscc` provider manages both Quick Setup configurations for the unified console and JIT,
  along with the optional GUI Connect recording preferences.

  **The `awscc` provider has to be configured with the same Region and role as `aws`.** It is a separate
  provider with its own credential and Region resolution, so a Terragrunt `root.hcl` that generates only an
  `aws` provider block leaves `awscc` falling back to `AWS_REGION` and the default profile. Because Cloud
  Control is a regional API, a mismatch does not fail loudly — it reads an empty result, which surfaces as
  `Cannot import non-existent remote object` when importing existing preferences, or as a plan that wants to
  create `awscc_ssmguiconnect_preferences` even though the account already has them, and then fails on apply.
  The scaffolded `terragrunt.hcl` generates the matching `awscc` provider block for this reason.

  Note that `awscc` is plugin-framework based, so its `assume_role` is a nested attribute assigned with `=`,
  not a block as in the `aws` provider.

  These recording preferences are also a **singleton per AWS account** — `account_id` is the resource's whole
  identifier. Only one deployment in an account can own `awscc_ssmguiconnect_preferences`; a second one
  enabling recording will collide with the first and the two will overwrite each other's bucket and key.

  Separately from `settings.fleet_manager`, the top level `settings.dhmc`, `settings.host_management` and
  `settings.patch` blocks drive **SSM Quick Setup** configuration managers. Where the Fleet Manager block
  creates individual resources in this account and Region, Quick Setup hands a configuration to Systems
  Manager and lets it deploy and maintain the underlying StackSets, associations and roles:

  - **`settings.dhmc`** rolls Default Host Management Configuration out across organizational units, so
    every EC2 instance in them becomes a managed node without an instance profile. This is the
    organization-wide counterpart to `settings.fleet_manager.default_host_management`, which configures the
    same feature in the current account only. Use one or the other, not both.
  - **`settings.host_management`** configures SSM Agent and EC2 Launch agent updates, inventory collection,
    daily patch scanning and the CloudWatch agent on the targeted instances.
  - **`settings.patch`** creates a Patch Policy that scans, or scans and installs, missing patches on a cron
    schedule against the AWS provided patch baselines resolved at plan time.

  Each of the three targets either the current account — through `target_type`, which selects every
  instance, an instance ID list, a tag pair or a resource group — or a set of organizational units through
  `target_organizational_units`. The two are mutually exclusive, and an organization-wide deployment has to
  be applied from the Quick Setup delegated administrator account, which delegation mode below registers.
  `settings.patch` additionally depends on the `AWS-QuickSetup-PatchPolicy` local deployment roles existing
  in the target account.

  It also runs in a second, mutually exclusive mode: when `settings.organization.delegated` is `true` the
  module creates **only** the SSM delegated administrator registrations in the Organizations management
  account, and none of the session logging or Fleet Manager resources.

  ## CloudFormation security recommendations for Quick Setup

  Quick Setup uses StackSets for Default Host Management, Host Management, Patch Policy, the unified
  Systems Manager console and Fleet Manager just-in-time node access. Review these Security Hub
  controls in each target account and Region.

  - **CloudFormation.3 — termination protection.** Enable protection on each root stack after deployment.
    Nested stacks inherit it. Disable protection before removing a target or deleting its configuration.
    [AWS stack protection guidance](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-protect-stacks.html)
  - **CloudFormation.4 — stack service role.** Use a least-privilege service role for stacks you manage directly.
    AWS cannot set the stack's `RoleARN` on service-managed StackSet instances, so these instances fail the
    control even when Quick Setup has a deployment role. Account for this limitation before choosing an
    organization-wide console or JIT rollout. [AWS Security Hub control](https://docs.aws.amazon.com/securityhub/latest/userguide/cloudformation-controls.html#cloudformation-4)

# How to use this project
usage: |-
  This module is consumed through Terragrunt. Bootstrap a deployment with the built-in scaffold command,
  which sources `.boilerplate/boilerplate.yml` to generate `terragrunt.hcl`, `inputs.yaml` and
  `local-tags.json` in the current directory.

  ```sh
  # 1. Create and enter the target deployment directory
  mkdir -p <environment>/<region>/<spoke>/ssm-session-management
  cd <environment>/<region>/<spoke>/ssm-session-management

  # 2. Scaffold the module (do NOT use --working-dir)
  terragrunt scaffold github.com/cloudopsworks/terraform-module-aws-ssm-session-management

  # 3. Edit inputs.yaml with deployment-specific values
  #    (all keys and comments are pre-populated from .boilerplate/inputs.yaml)
  vi inputs.yaml

  # 4. Apply
  terragrunt apply
  ```

  ### Generated `inputs.yaml`

  Every key is optional; the defaults shown are what the module applies when a key is omitted.

  ```yaml
  # Module configuration
  settings:
    # random_bucket_suffix: true                    # (Optional) Deprecated, use bucket.random_suffix instead. Default: true
    # allowed_iam_role_arns: []                     # (Optional) IAM role ARNs allowed to write to the audit bucket and use the KMS key. Default: []
    # allowed_iam_role_names: []                    # (Optional) IAM role names in the current account, resolved to ARNs and merged with allowed_iam_role_arns. Supports "*" and "?" wildcards, e.g. "ssm-*" or "*-instance-role". Resolved by listing roles at plan time, so a role created later that matches an existing pattern is picked up on the next plan. Each entry must contain at least one literal character. Default: []
    # admin_iam_role_arns: []                       # (Optional) IAM role ARNs granted full object access on the audit bucket (read, create, delete, multipart, listing and encryption discovery), plus the KMS data plane actions that access depends on. Merged with whatever admin_iam_role_names resolves to. Use for cross-account roles, which cannot be looked up by name. Default: []
    # admin_iam_role_names: []                      # (Optional) IAM role names in the current account granted full object access on the audit bucket -- GetObject, PutObject, DeleteObject, their versioned and multipart counterparts, ListBucket and GetEncryptionConfiguration -- plus the KMS Encrypt/Decrypt/GenerateDataKey actions that access depends on (the bucket is SSE-KMS, so S3 actions alone cannot read an object body). Not s3:*, which would also permit rewriting the bucket policy or deleting the bucket. Same "*"/"?" wildcard support and plan-time resolution as allowed_iam_role_names, and each entry must contain at least one literal character. Use for break-glass or audit-review roles, not for the instance roles that write session logs. Default: []
    # create_grant_iam_role_arns: []                # (Optional) IAM role ARNs granted kms:CreateGrant on the module KMS key. Grants no S3 access at all. Merged with whatever create_grant_iam_role_names resolves to. Use for cross-account roles, which cannot be looked up by name. Default: []
    # create_grant_iam_role_names: []               # (Optional) IAM role names in the current account granted kms:CreateGrant on the module KMS key, for features that hand the key to another AWS service on the caller's behalf -- Just-in-Time node access and RDP recording. Key policy only: these roles get no access to the audit bucket. Supports "*" and "?" wildcards and is resolved by listing roles at plan time, exactly as allowed_iam_role_names. Each entry must contain at least one literal character. Default: []

    # organization:                                 # (Optional) Delegation mode. When delegated is true ONLY the delegated administrator registrations are created — no bucket, key, log group or session document.
    #   delegated: false                            # (Optional) Run in delegation mode. Must be applied against the Organizations management account. Default: false
    #   account_id: "123456789012"                  # (Required when delegated is true) Account ID to register as SSM delegated administrator.

    bucket:                                         # (Optional) Audit log S3 bucket settings
      # name: ""                                    # (Optional) Explicit bucket name, 3-63 characters. When set, no name is generated and no random suffix is added. Default: "" (generates "ssm-session-auditlogs-<system-name>")
      random_suffix: true                           # (Optional) Append a random 8 character suffix to the generated bucket name. Ignored when name is set. Default: true
      # versioning: false                           # (Optional) Enable versioning on the audit bucket. Default: false

    kms:                                            # (Optional) KMS configuration for encryption
      enabled: true                                 # (Optional) Create a new KMS key for session data. Default: true
      # key_alias: ""                               # (Optional) Existing KMS key alias to use when enabled is false. Default: ""
      # key_id: ""                                  # (Optional) Existing KMS key ID to use when enabled is false. Default: ""
      # deletion_window: 30                         # (Optional) Deletion window in days for the created key. Default: 30
      # enable_key_rotation: true                   # (Optional) Enable automatic key rotation. Default: true
      # rotation_period_in_days: 90                 # (Optional) Rotation period in days. Default: 90
      # multi_region: false                         # (Optional) Create the key as multi-region. Default: false
      # alias_name: "ssm-session-mgmt-key"          # (Optional) Alias name for the created key, without the "alias/" prefix. Default: "ssm-session-mgmt-key-<system-name>"

    session:                                        # (Optional) Session Manager preferences written to the SSM-SessionManagerRunShell document
      # run_as: ""                                  # (Optional) OS user to run the session as. Default: ""
      # run_as_enabled: false                       # (Optional) Whether Session Manager honours run_as. Default: true when run_as is non-empty, false otherwise
      timeout: 20                                   # (Optional) Idle session timeout in minutes, valid values 1-60. Default: 20
      max_duration: 60                              # (Optional) Maximum session duration in minutes, valid values 1-1440. Default: 60
      # shell_profile:                              # (Optional) Commands run at session start, per platform
      #   linux: ""                                 # (Optional) Shell commands to run when a Linux session starts. Default: ""
      #   windows: ""                               # (Optional) Shell commands to run when a Windows session starts. Default: ""

    audit:                                          # (Optional) Audit log retention settings for S3
      # s3_key_prefix: "session-manager/"           # (Optional) Key prefix for session logs written to the bucket. The lifecycle rule below is scoped to this prefix, so other data sharing the bucket is left alone. Default: "session-manager/"
      transition_days: 30                           # (Optional) Days before transitioning logs to STANDARD_IA. STANDARD_IA bills a 128 KB minimum per object, which can cost more than STANDARD for small session logs. Default: 30
      archive_days: 60                              # (Optional) Days before transitioning logs to GLACIER. Default: 60
      retention_years: 5                            # (Optional) Years to retain logs before expiration. Default: 5
      # abort_multipart_days: 7                     # (Optional) Days before aborting incomplete multipart uploads. Default: 7

    cloudwatch:                                     # (Optional) CloudWatch logging settings
      enabled: false                                # (Optional) Enable CloudWatch logging of sessions. Default: false
      # retention: 7                                # (Optional) Log retention in days. Default: 7
      # streaming: false                            # (Optional) Stream session output continuously instead of writing on session end. Default: false

    # fleet_manager:                                # (Optional) Fleet Manager settings. All of these are account and Region wide, and are ignored in delegation mode.
    #   enabled: false                              # (Optional) Master toggle for this whole block. Nothing below is created unless this is true. Default: false
    #
    #   default_host_management:                    # (Optional) Default Host Management Configuration — lets Systems Manager manage every EC2 instance in this account and Region as a managed node, with no instance profile.
    #     enabled: false                            # (Optional) Turn on Default Host Management Configuration. Instances need IMDSv2 and SSM Agent 3.2.582.0 or later. Default: false
    #     create_role: true                         # (Optional) Create the IAM role. Set to false to point the setting at a role managed elsewhere. Default: true
    #     role_name: ""                             # (Optional) Name of the IAM role Systems Manager assumes. Default: "AWSSystemsManagerDefaultEC2InstanceManagementRole"
    #     role_path: "/service-role/"               # (Optional) IAM path of that role, leading and trailing slash included. Default: "/service-role/"
    #     additional_policy_arns: []                # (Optional) Extra managed policy ARNs attached to the created role. These apply to every managed instance in the Region. Default: []
    #     session_logging_access: true              # (Optional) Attach an inline policy letting managed nodes write session logs to this module's audit bucket, KMS key and log group. Ignored when create_role is false. Default: true
    #
    #   inventory:                                  # (Optional) Inventory collection — populates the Fleet Manager node detail views. Systems Manager permits only one inventory association per node.
    #     enabled: false                            # (Optional) Create the AWS-GatherSoftwareInventory association. Default: false
    #     schedule: "rate(1 day)"                   # (Optional) Rate or cron expression for the collection schedule, minimum 30 minutes. Default: "rate(1 day)"
    #     association_name: ""                      # (Optional) Name of the State Manager association, 3-128 characters of [A-Za-z0-9_.-]. Default: "ssm-inventory-<system-name>"
    #     apply_only_at_cron_interval: false        # (Optional) Skip the immediate run on apply and wait for the first scheduled interval. Default: false
    #     max_concurrency: ""                       # (Optional) Nodes to run against at once, as a number or a percentage such as "10%". Default: "" (unset, AWS decides)
    #     max_errors: ""                            # (Optional) Errors tolerated before the association stops, as a number or a percentage. Default: "" (unset, AWS decides)
    #     targets:                                  # (Optional) Up to 5 target blocks. Default: every managed node, as below.
    #       - key: "InstanceIds"                    # (Required within targets) Target key, e.g. "InstanceIds", "tag:Environment", "resource-groups:Name".
    #         values: ["*"]                         # (Required within targets) Values for that key.
    #     applications: "Enabled"                   # (Optional) Collect installed application metadata. Values: Enabled, Disabled. Default: "Enabled"
    #     aws_components: "Enabled"                 # (Optional) Collect AWS component metadata such as amazon-ssm-agent. Values: Enabled, Disabled. Default: "Enabled"
    #     custom_inventory: "Enabled"               # (Optional) Collect custom inventory metadata. Values: Enabled, Disabled. Default: "Enabled"
    #     instance_detailed_information: "Enabled"  # (Optional) Collect CPU model, speed and core count. Values: Enabled, Disabled. Default: "Enabled"
    #     network_config: "Enabled"                 # (Optional) Collect network configuration metadata. Values: Enabled, Disabled. Default: "Enabled"
    #     services: "Enabled"                       # (Optional) Collect Windows service configuration. Windows only. Values: Enabled, Disabled. Default: "Enabled"
    #     windows_roles: "Enabled"                  # (Optional) Collect Windows roles. Windows only. Values: Enabled, Disabled. Default: "Enabled"
    #     windows_updates: "Enabled"                # (Optional) Collect installed Windows updates. Windows only. Values: Enabled, Disabled. Default: "Enabled"
    #     files: ""                                 # (Optional) JSON string selecting files to inventory. Only sent when non-empty. Default: ""
    #     windows_registry: ""                      # (Optional) JSON string selecting Windows registry keys to inventory. Only sent when non-empty. Default: ""
    #
    #   unified_console:                           # (Optional) Manage the unified Systems Manager console through Quick Setup.
    #     enabled: true                          # (Optional) Defaults to whether JIT access is enabled. Set true to keep the console independently or false to use an externally managed console.
    #     name: ""                               # (Optional) Name of the Quick Setup configuration manager. Defaults to a name derived from the system name.
    #     description: ""                        # (Optional) Description of the Quick Setup configuration manager.
    #     target_regions: ""                     # (Optional) Comma-separated target Regions. Defaults to the JIT target Regions or its home Region.
    #     organization_root_id: ""               # (Optional) Organization root ID, for organization mode only. Discovered automatically when omitted.
    #     agent_update_schedule: "none"          # (Optional) Quick Setup schedule for SSM Agent updates. Default: "none".
    #     enable_dhmc_schedule: "none"           # (Optional) Quick Setup schedule for Default Host Management Configuration. Default: "none".
    #     inventory_collection_schedule: "none"  # (Optional) Quick Setup schedule for Inventory collection. Default: "none".
    #     type_version: ""                       # (Optional) Quick Setup type version. Omit to use the provider or AWS default.
    #     additional_parameters: {}              # (Optional) Extra string parameters from the Quick Setup configuration definition.
    #     deployment_roles:                     # (Optional) Supply a separate existing role pair. Omit to share JIT roles, or set {} to omit both roles for an organization deployment.
    #       administration_role_arn: ""         # (Required for a role pair) ARN of the existing local StackSet administration role.
    #       execution_role_name: ""             # (Required for a role pair) Name of the existing local StackSet execution role with AWSQuickSetupSSMDeploymentRolePolicy.
    #
    #   remote_desktop:                           # (Optional) Fleet Manager Remote Desktop access and recording settings.
    #     just_in_time_node_access:             # (Optional) Enable just-in-time node access for Fleet Manager through Quick Setup. Enables the unified console by default.
    #       enabled: false                      # (Optional) Set up just-in-time node access with or without recording. Required when recording is enabled. Default: false
    #       organization_level: false           # (Optional) Set it up across organizational units rather than for this account alone. When true the module must be applied from the Systems Manager delegated administrator account and target_organizational_units is required; when false it targets target_accounts instead. Default: false
    #       target_organizational_units: ""     # (Required when organization_level is true) Comma separated organizational unit IDs, or the organization root ID. Not sent when organization_level is false.
    #       target_accounts: ""                 # (Optional, organization_level false only) Comma separated account IDs. Not sent when organization_level is true. Default: "" (the account this module is applied in)
    #       target_regions: ""                  # (Optional) Comma separated Regions to enable it in. Must match, or be a subset of, the unified console target Regions. Default: "" (the Region this module is applied in)
    #       home_region: ""                     # (Optional) Console home Region. Configure awscc in this Region to create or import the managers. Defaults to the aws provider Region.
    #       delegated_account_id: ""            # (Optional) Account ID of the Systems Manager delegated administrator. Default: "" (settings.organization.account_id when set, otherwise the current account)
    #       identity_provider: "IAM"            # (Optional) Where the approver identity behind an access request is read from. Values: IAM, SSO. Default: "IAM"
    #       name: ""                            # (Optional) Name of the Quick Setup configuration manager. Default: "" ("<system-name>-jitna")
    #       create_deployment_roles: true       # (Optional) Create the Quick Setup local deployment roles. Set to false when Quick Setup already created them here, since IAM rejects a duplicate role name. An organization level setup then sends no role at all, which AWS permits; a single account setup always sends them, because AWS requires them there. Default: true
    #       administration_role_name: ""        # (Optional) Name of the administration role CloudFormation assumes to run the deployment. Default: "" ("AWS-QuickSetup-StackSet-Local-AdministrationRole")
    #       execution_role_name: ""             # (Optional) Name of the execution role the deployment runs as. Default: "" ("AWS-QuickSetup-StackSet-Local-ExecutionRole")
    #       additional_policy_arns: []          # (Optional) Extra managed policy ARNs attached to the execution role, on top of AWSQuickSetupDeploymentRolePolicy and AWSQuickSetupJITNADeploymentRolePolicy. Default: []
    #     recording:                              # (Optional) RDP connection recording, uploaded to S3 by the ssm-guiconnect service principal.
    #       enabled: false                        # (Optional) Record RDP connections. Requires just-in-time node access and a symmetric customer managed KMS key. Default: false
    #       just_in_time_node_access_enabled: false # (Optional) Legacy opt-in for recording. Use remote_desktop.just_in_time_node_access.enabled. Default: false
    #       bucket_name: ""                       # (Optional) Destination S3 bucket. Default: "" (the audit bucket). Grant GUI Connect access to externally managed buckets and SSE-KMS keys.
    #       bucket_owner: ""                      # (Optional) Account ID owning the destination bucket. Default: "" (the current account)
    #       kms_key_arn: ""                       # (Optional) Symmetric encrypt/decrypt customer managed key used to encrypt the recording while Systems Manager processes it. Default: "" (this module's key)

    #   resource_data_sync:                         # (Optional) Aggregates the collected Inventory into an S3 bucket so it can be queried with Athena.
    #     enabled: false                            # (Optional) Create the resource data sync. Default: false
    #     name: ""                                  # (Optional) Name of the sync. Default: "ssm-inventory-<system-name>"
    #     bucket_name: ""                           # (Optional) Destination bucket. Leave empty to use this module's own audit bucket, in which case the required bucket policy statements and KMS grants are added automatically. Default: ""
    #     prefix: "inventory"                       # (Optional) Key prefix for the synchronised data. Set to "" to write at the bucket root. Default: "inventory"
    #     region: ""                                # (Optional) Region of the destination bucket. Default: "" (the region this module is applied in)
    #     kms_key_arn: ""                           # (Optional) KMS key ARN used to encrypt the synchronised data. Default: "" (this module's key when the audit bucket is the destination)

    # ---------------------------------------------------------------------------------
    # SSM Quick Setup configuration managers.
    #
    # These three blocks are independent of fleet_manager above: they deploy AWS Systems
    # Manager Quick Setup configurations rather than individual resources, and each one can
    # target this account or a set of organizational units. All are ignored in delegation
    # mode. Organization-wide deployments must be applied from the Quick Setup delegated
    # administrator account — the account registered through settings.organization.
    # ---------------------------------------------------------------------------------

    # dhmc:                                         # (Optional) Quick Setup Default Host Management Configuration (AWSQuickSetupType-DHMC). Rolls DHMC out across organizational units, so every EC2 instance in them becomes a managed node without an instance profile.
    #   enabled: false                              # (Optional) Create the DHMC Quick Setup configuration manager. Default: false
    #   update_ssm_agent: true                      # (Optional) Update SSM Agent on target instances every two weeks. Default: true
    #   target_organizational_units: "ou-abcd-1111" # (Required when enabled is true) Comma separated list of organizational unit IDs to deploy to. DHMC has no local-account targeting mode.
    #   target_regions: "us-east-1"                 # (Optional) Comma separated list of regions to deploy to. Default: "" (the region this module is applied in)

    # host_management:                              # (Optional) Quick Setup Host Management (AWSQuickSetupType-SSMHostMgmt). Configures agent updates, inventory collection, patch scanning and the CloudWatch agent on the targeted instances.
    #   enabled: false                              # (Optional) Create the Host Management Quick Setup configuration manager. Default: false
    #   update_ssm_agent: true                      # (Optional) Update SSM Agent on target instances every two weeks. Default: true
    #   update_ec2_launch_agent: false              # (Optional) Update the EC2 Launch agent monthly. Windows only. Default: false
    #   collect_inventory: true                     # (Optional) Collect instance metadata every 30 minutes. Do not combine with fleet_manager.inventory — Systems Manager permits only one inventory association per node. Default: true
    #   scan_instances: true                        # (Optional) Scan target instances daily for missing patches. Default: true
    #   install_cloudwatch_agent: false             # (Optional) Install the CloudWatch agent on target instances. Default: false
    #   update_cloudwatch_agent: false              # (Optional) Update the CloudWatch agent monthly. Default: false
    #   is_policy_attach_allowed: false             # (Optional) Allow Quick Setup to attach policies to instance profiles already associated with the target instances. Default: false
    #   #
    #   # Targeting: use EITHER target_type (local account) OR target_organizational_units
    #   # (organization). Supplying both is rejected.
    #   target_type: "*"                            # (Optional) How instances are targeted in this account. Values: "*" (every instance), InstanceIds, Tags, ResourceGroups. Leave unset when deploying to OUs. Default: "" (unset)
    #   target_instances: "i-1234567890abcdef0"     # (Required when target_type is InstanceIds) Comma separated list of instance IDs.
    #   target_tag_key: "Environment"               # (Required when target_type is Tags) Tag key assigned to the instances to target.
    #   target_tag_value: "production"              # (Required when target_type is Tags) Value of that tag key.
    #   resource_group_name: "my-group"             # (Required when target_type is ResourceGroups) Name of the resource group holding the instances to target.
    #   target_organizational_units: "ou-abcd-1111" # (Optional) Comma separated list of organizational unit IDs to deploy to. Mutually exclusive with target_type. Default: ""
    #   target_accounts: "123456789012"             # (Optional) Comma separated list of account IDs for a local deployment. Default: ""
    #   target_regions: "us-east-1"                 # (Optional) Comma separated list of regions to deploy to. Default: "" (the region this module is applied in)

    # patch:                                        # (Optional) Quick Setup Patch Policy (AWSQuickSetupType-PatchPolicy). Quick Setup must already have created the AWS-QuickSetup-PatchPolicy local deployment roles in this account — configure a patch policy once from the console, or let this module create the first one.
    #   enabled: false                              # (Optional) Create the Patch Policy Quick Setup configuration manager. Default: false
    #   policy_name: ""                             # (Optional) Name of the patch policy, also applied to target instances as a tag. Default: "" (the short system name)
    #   operation: "Scan"                           # (Optional) Whether instances only scan for patches, or scan and install them. Values: Scan, ScanAndInstall. Default: "Scan"
    #   scan_value: "cron(0 1 * * ? *)"             # (Optional) Cron expression scheduling the patch scan. Default: "cron(0 1 * * ? *)"
    #   scan_next_interval: false                   # (Optional) Scan at the next cron interval instead of waiting a full cycle. Default: false
    #   install_value: "cron(0 2 * * ? *)"          # (Optional) Cron expression scheduling the patch install. Only sent when operation is ScanAndInstall. Default: "" (falls back to scan_value)
    #   install_next_interval: false                # (Optional) Install at the next cron interval. Only sent when operation is ScanAndInstall. Default: false
    #   reboot_option: "RebootIfNeeded"             # (Optional) Whether instances reboot after patches install. Values: RebootIfNeeded, NoReboot. Default: "" (unset, AWS decides)
    #   default_baselines: true                     # (Optional) Restrict the patch baseline lookup to AWS default baselines. Default: true
    #   baseline_use: "default"                     # (Optional) Whether the selected baselines are all AWS provided. Values: default, custom. Default: "default"
    #   baseline_region: "us-east-1"                # (Optional) Region where the patch baselines exist. Default: "" (the region this module is applied in)
    #   rate_control_concurrency: "10%"             # (Optional) Instances patched at once, as a number or a percentage. Default: "10%"
    #   rate_control_error_threshold: "2%"          # (Optional) Errors tolerated before the deployment stops, as a number or a percentage. Default: "2%"
    #   is_policy_attach_allowed: false             # (Optional) Allow Quick Setup to attach policies to instance profiles already associated with the target instances. Default: false
    #   output_s3_bucket_name: ""                   # (Optional) Bucket receiving patch command output logs. Output logging is enabled only when this is set. This module neither creates that bucket nor grants access to it. Default: "" (logging disabled)
    #   output_s3_bucket_region: ""                 # (Optional) Region of that bucket. Default: "" (the region this module is applied in)
    #   output_s3_key_prefix: ""                    # (Optional) Key prefix used within that bucket. Default: ""
    #   #
    #   # Targeting behaves exactly as documented under host_management above.
    #   target_type: "*"                            # (Optional) How instances are targeted in this account. Values: "*", InstanceIds, Tags, ResourceGroups. Leave unset when deploying to OUs. Default: "" (unset)
    #   target_instances: "i-1234567890abcdef0"     # (Required when target_type is InstanceIds) Comma separated list of instance IDs.
    #   target_tag_key: "Environment"               # (Required when target_type is Tags) Tag key assigned to the instances to target.
    #   target_tag_value: "production"              # (Required when target_type is Tags) Value of that tag key.
    #   resource_group_name: "my-group"             # (Required when target_type is ResourceGroups) Name of the resource group holding the instances to target.
    #   target_organizational_units: "ou-abcd-1111" # (Optional) Comma separated list of organizational unit IDs to deploy to. Mutually exclusive with target_type. Default: ""
    #   target_accounts: "123456789012"             # (Optional) Comma separated list of account IDs for a local deployment. Default: ""
    #   target_regions: "us-east-1"                 # (Optional) Comma separated list of regions to deploy to. Default: "" (the region this module is applied in)
  ```

  ### Generated `terragrunt.hcl`

  Scaffold renders the file below; `inputs.yaml` is loaded as `local.local_vars` and each module variable is
  wired into the `inputs` block. The `org`, `spoke_def` and `extra_tags` values come from the Terragrunt
  hierarchy, not from `inputs.yaml`.

  ```hcl
  locals {
    local_vars  = yamldecode(file("./inputs.yaml"))
    spoke_vars  = yamldecode(file(find_in_parent_folders("spoke-inputs.yaml")))
    region_vars = yamldecode(file(find_in_parent_folders("region-inputs.yaml")))
    env_vars    = yamldecode(file(find_in_parent_folders("env-inputs.yaml")))
    global_vars = yamldecode(file(find_in_parent_folders("global-inputs.yaml")))

    local_tags  = jsondecode(file("./local-tags.json"))
    spoke_tags  = jsondecode(file(find_in_parent_folders("spoke-tags.json")))
    region_tags = jsondecode(file(find_in_parent_folders("region-tags.json")))
    env_tags    = jsondecode(file(find_in_parent_folders("env-tags.json")))
    global_tags = jsondecode(file(find_in_parent_folders("global-tags.json")))

    tags = merge(
      local.global_tags,
      local.env_tags,
      local.region_tags,
      local.spoke_tags,
      local.local_tags
    )
  }

  include "root" {
    path = find_in_parent_folders("root.hcl")
    # Exposes the root config so the awscc provider below can reuse its region and role.
    expose = true
  }

  # root.hcl generates the aws provider only; awscc needs the same region and role.
  generate "provider_awscc" {
    path      = "provider-awscc.g.tf"
    if_exists = "overwrite_terragrunt"
    contents  = <<EOF
  provider "awscc" {
    region = "${include.root.locals.region}"
    assume_role = {
      role_arn     = "${include.root.locals.sts_role_arn}"
      session_name = "terragrunt"
    }
  }
  EOF
  }

  terraform {
    source = "git::https://github.com/cloudopsworks/terraform-module-aws-ssm-session-management.git?ref=v1.1.0"
  }

  inputs = {
    is_hub     = false
    org        = local.env_vars.org
    spoke_def  = local.spoke_vars.spoke
    settings   = try(local.local_vars.settings, {})
    extra_tags = local.tags
  }
  ```

# Example usage
examples: |-
  ### Minimal

  Leave `inputs.yaml` at its defaults. The module creates the audit bucket with a random suffix, a customer
  managed KMS key, and the Session document. CloudWatch logging stays off.

  ```yaml
  settings:
    kms:
      enabled: true
  ```

  ### CloudWatch logging with a longer retention

  ```yaml
  settings:
    cloudwatch:
      enabled: true
      retention: 30
      streaming: true
    kms:
      enabled: true
      deletion_window: 7
      rotation_period_in_days: 180
    audit:
      retention_years: 7
  ```

  ### Granting instance roles access to the audit bucket

  Roles may be given as ARNs, as plain names resolved in the current account, or both. The two lists are
  merged and de-duplicated.

  ```yaml
  settings:
    allowed_iam_role_names:
      - "ec2-ssm-managed-instance-role"
      - "bastion-instance-role"
    allowed_iam_role_arns:
      - "arn:aws:iam::123456789012:role/cross-account-session-role"
  ```

  Names may also use `*` and `?` wildcards. Because neither character is legal in an IAM role name, an
  entry containing either is treated as a pattern; everything else is matched exactly.

  ```yaml
  settings:
    allowed_iam_role_names:
      - "ssm-*"                 # every role whose name starts with "ssm-"
      - "*-instance-role"       # every role whose name ends with "-instance-role"
      - "ec2-?-worker"          # "?" matches exactly one character
      - "bastion-instance-role" # no wildcard, matched exactly
  ```

  Patterns are anchored, so `ssm-*` matches `ssm-session-role` but not `my-ssm-session-role`.

  Two behaviours to be aware of when using wildcards:

  - **Membership is re-evaluated on every plan.** Terraform lists the account's roles and filters them,
    so a role created later that matches an existing pattern is added to the bucket and KMS key policies
    on the next apply, with no change to this configuration. Exact names do not behave this way.
  - **A pattern that matches nothing is silent.** A misspelled exact name fails the plan; a misspelled
    pattern simply grants no access. Check the `allowed_iam_role_arns`, `admin_iam_role_arns` and
    `create_grant_iam_role_arns` outputs to see what actually resolved.

  Wildcards require `iam:ListRoles` in addition to the `iam:GetRole` needed for exact names. A pattern
  made up only of wildcards is rejected, since it would match every role in the account.

  Every rule in this section applies identically to `settings.admin_iam_role_names` and
  `settings.create_grant_iam_role_names`, which are resolved through the same lookups — a name appearing
  in more than one list is only queried once. The difference is the grant each list produces, covered
  under *Granting administrative roles full access to the audit bucket* and
  *Granting kms:CreateGrant to specific roles* below.

  ### Reusing an existing KMS key

  ```yaml
  settings:
    kms:
      enabled: false
      key_alias: "alias/my-existing-session-key"
  ```

  ### Running a start-up command in every session

  ```yaml
  settings:
    session:
      run_as: "ec2-user"
      run_as_enabled: true
      timeout: 15
      max_duration: 120
      shell_profile:
        linux: "cd /var/log && echo 'Session started'"
  ```

  ### Adopting a fleet with Default Host Management Configuration

  Turns every EC2 instance in this account and Region into a managed node without an instance profile,
  and grants the role Systems Manager assumes write access to this module's audit bucket, KMS key and log
  group. Instances must run IMDSv2 and SSM Agent 3.2.582.0 or later; an instance profile that already
  allows `ssm:UpdateInstanceInformation` takes precedence and keeps that instance off DHMC.

  ```yaml
  settings:
    cloudwatch:
      enabled: true
    fleet_manager:
      enabled: true
      default_host_management:
        enabled: true
        additional_policy_arns:
          - "arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy"
  ```

  With this in place `settings.allowed_iam_role_names` is usually unnecessary — the nodes get their audit
  bucket access from the Default Host Management Configuration role rather than from an instance profile.

  ### Inventory collection and resource data sync

  Inventory is what fills in the Fleet Manager node detail views. The resource data sync then aggregates
  it into S3 so it can be queried with Athena; leaving `bucket_name` empty sends it to the audit bucket
  this module already manages, and the required bucket policy statements and KMS grants are added for you.

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      inventory:
        enabled: true
        schedule: "rate(12 hours)"
        max_concurrency: "10%"
        max_errors: "5%"
      resource_data_sync:
        enabled: true
        prefix: "inventory"
  ```

  Two things to know before turning Inventory on:

  - **One apply-all association per account.** Systems Manager allows only one inventory association that
    targets every node, so in an account that already has one — Quick Setup and the console both create
    one — the apply fails with `Multiple apply all associations with document
    'AWS-GatherSoftwareInventory' are not supported`. Find it with
    `aws ssm list-associations --association-filter-list key=AssociationName,value=InventoryAssociation`
    (or list all and look for the document name), then either import it, delete it, or leave
    `inventory.enabled` at `false` and keep using the existing one. Targeting by tag instead of the
    default apply-all also avoids the collision.
  - **The audit lifecycle rule is scoped to `settings.audit.s3_key_prefix`.** Session logs still transition
    and expire on schedule; Inventory data sharing the bucket stays in STANDARD so it remains queryable.

  Narrow the collection with targets and per-category toggles:

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      inventory:
        enabled: true
        targets:
          - key: "tag:Environment"
            values: ["production"]
        windows_updates: "Disabled"
        windows_roles: "Disabled"
        services: "Disabled"
        files: '[{"Path":"/usr/bin","Pattern":["*ssm*"],"Recursive":false}]'
  ```

  ### Unified Systems Manager console

  When you enable just-in-time node access, the module also manages the unified console through an
  `AWSQuickSetupType-SSM` configuration manager. Use `settings.fleet_manager.unified_console.enabled: true`
  to manage the console independently of JIT. Use `false` when a separate deployment owns the console
  and already covers the JIT target accounts and Regions.

  Set the `awscc` provider Region to the console home Region for creation and import. The console and
  JIT share the deployment mode and `home_region` under `settings.fleet_manager.remote_desktop.just_in_time_node_access`.
  After creating or updating the console manager, the module reads its deployment status through
  Cloud Control. JIT proceeds when the status is `SUCCEEDED`. If Quick Setup is still deploying,
  run a fresh plan and apply after the deployment succeeds.
  For a single account, use the current account and set the target Region to the home Region. For an
  organization, enable trusted access for Systems Manager, Quick Setup, CloudFormation StackSets and
  AWS Resource Explorer in AWS Organizations, register delegated administrators, and apply from the Systems Manager
  delegated administrator account. The console targets the organization root, which
  the module discovers unless you supply `unified_console.organization_root_id`. JIT can target
  selected OUs and a subset of the console Regions. [AWS CloudFormation example](https://github.com/aws-samples/cloud-operations-best-practices/blob/main/cloud-operations-best-practices/static/cfn-templates/just-in-time-node-access/just-in-time-quick-setup-cfn-template.yaml)

  The module defaults the console's agent update, Default Host Management Configuration and Inventory
  collection schedules to `none`. Keep these defaults when another deployment, such as SSM Compliance
  Management, owns those capabilities. The module adds `AWSQuickSetupSSMDeploymentRolePolicy` to the
  shared execution role when it creates the role. Omit `unified_console.deployment_roles` to share
  the JIT role configuration. If the console already uses a different role pair, set
  `unified_console.deployment_roles.administration_role_arn` and `execution_role_name` to the existing
  values. For an organization manager that was deployed with both fields omitted, set
  `unified_console.deployment_roles: {}` to preserve that configuration. Attach
  `AWSQuickSetupSSMDeploymentRolePolicy` in the role's owning stack when the execution role already
  exists, including when using a different role pair for the console.

  #### Adopt an existing unified console before the first apply

  **Before upgrading a deployment with JIT enabled**, check for a console manager in the home Region.
  If the console will stay under external ownership, set `unified_console.enabled: false` before
  planning. To adopt the existing console, first confirm its current owner and coordinate the state
  transfer so only one state manages the manager. Keep console management enabled in this module
  during import.

  List managers while authenticated to the account that owns the console. Use the console home
  Region and copy the full `ManagerArn` for the `AWSQuickSetupType-SSM` manager.

  ```sh
  aws ssm-quicksetup list-configuration-managers --region us-east-1 \
    --query "ConfigurationManagersList[?contains(ConfigurationDefinitionSummaries[].Type, 'AWSQuickSetupType-SSM')].{Name:Name,ManagerArn:ManagerArn}"

  manager_arn='arn:aws:ssm-quicksetup:us-east-1:123456789012:configuration-manager/01234567-89ab-cdef-0123-456789abcdef'
  aws ssm-quicksetup get-configuration-manager --region us-east-1 --manager-arn "$manager_arn"
  ```

  Confirm that the `Deployment` entry under `StatusSummaries` is `SUCCEEDED` before enabling JIT.
  Match the existing manager's name, description, tags, deployment roles, target root or account,
  target Regions and schedules in the inputs. Use `unified_console.type_version` and
  `unified_console.additional_parameters` to retain the existing version and additional parameters
  where needed. Reuse existing deployment roles through their owning stack.
  [AWS CLI manager details](https://docs.aws.amazon.com/cli/latest/reference/ssm-quicksetup/get-configuration-manager.html)

  From the Terragrunt unit that uses this module as its source, import the manager using its full ARN.

  ```sh
  terragrunt run -- import 'awscc_ssmquicksetup_configuration_manager.unified_console[0]' "$manager_arn"
  ```

  For a Terraform root module calling this module as `module "ssm_session"`, use the corresponding
  module address.

  ```sh
  terraform import 'module.ssm_session.awscc_ssmquicksetup_configuration_manager.unified_console[0]' "$manager_arn"
  ```

  Review the next plan for unintended updates, creation of a second manager, or replacement of the
  imported manager. Keep the console enabled while this state owns it. If you disable JIT, set
  `unified_console.enabled: true` first to retain the console independently. Turning off JIT with
  the console setting omitted, or explicitly disabling the console while it is in state, schedules
  the manager's deletion. To transfer ownership without
  deleting the console, remove its binding from the old state and import it into the new state.
  [AWSCC provider import format](https://registry.terraform.io/providers/hashicorp/awscc/latest/docs/resources/ssmquicksetup_configuration_manager#import)

  ### Just-in-time access for Fleet Manager Remote Desktop

  Enable just-in-time node access to request temporary access to managed Windows nodes through
  Fleet Manager. It works independently of the SSM Compliance Management module. AWS bills for
  just-in-time node access after its 30-day trial.

  The unified console must cover the JIT targets. Follow the adoption instructions above if the
  console already exists. Set `home_region` and the `awscc` provider to the console's home Region.
  [AWS setup and IAM permissions](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-setting-up.html)

  The following configuration enables just-in-time access with recording left at its default.

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      remote_desktop:
        just_in_time_node_access:
          enabled: true
  ```

  The module creates the `AWSQuickSetupType-JITNA` configuration and, by default, the
  CloudFormation StackSet deployment roles. Use `create_deployment_roles: false` to reuse roles
  that already exist. A single-account deployment passes the administration and execution roles
  to Quick Setup and defaults to the current account. For an organizational deployment, apply
  from the Systems Manager delegated administrator account, set `organization_level: true`, and
  supply `target_organizational_units`. Quick Setup can omit the deployment roles in this mode
  when `create_deployment_roles: false`.

  1. In Quick Setup, confirm the configuration has deployed successfully to the node's
     account and Region. Manager creation starts the deployment.
  2. In the target account and Region, make sure an approval policy matches the Windows node.
     A manual policy defines the approvers, access duration and node targets.
     [Create a manual approval policy](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-create-manual-policies.html)
  3. Give operators the JIT requester IAM permissions. Sign in with temporary AWS STS
     `AssumeRole` credentials and use the same account and Region as the node.
     [AWS requester IAM policy](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-setting-up.html)
  4. Select the managed Windows node and choose **Connect**. Submit a request, confirm that
     the policy grants access, then verify that Remote Desktop opens. Use a supported Windows
     login method such as user credentials. Fleet Manager's Remote Desktop Single Sign-On
     login option is unavailable for JIT sessions. The `identity_provider` setting selects how
     JIT evaluates identities independently of the Windows login method.
     [Start a JIT access session](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-start-session.html)

  To require JIT for these users after testing their approval policies, remove standing
  `ssm:StartSession` permissions from their IAM policies.
  [AWS migration guidance](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-start-session.html)

  JIT general session and logging preferences use the regional `SSM-SessionManagerRunShell`
  document. For deployments spanning accounts or Regions, manage the preferences in each
  target. Tag external KMS keys used for JIT session encryption or RDP recording with
  `SystemsManagerJustInTimeNodeAccessManaged=true`.
  [AWS session preferences](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-session-preferences.html)

  ### Recording Remote Desktop connections

  On a new deployment, enable JIT first and confirm Quick Setup reports successful deployment
  in the target account and Region. Then set `remote_desktop.recording.enabled: true` to record
  RDP connections. GUI Connect requires JIT to be active when it registers recording preferences.
  Existing configurations can continue using `recording.just_in_time_node_access` or the flat
  `recording.just_in_time_node_access_enabled` flag when recording is enabled. If the new
  `remote_desktop.just_in_time_node_access` block is present, its settings take precedence as
  a whole.

  Leave `bucket_name` empty to deliver recordings to the module's audit bucket. The module adds the
  GUI Connect bucket policy statement and configures its own KMS key for delivery. If the audit
  bucket uses a customer managed key supplied through `settings.kms.key_id` or `settings.kms.key_alias`,
  update that key's policy yourself. The key that encrypts the bucket can differ from the key that
  encrypts the recording while Systems Manager processes it.

  ```yaml
  settings:
    kms:
      enabled: true
    fleet_manager:
      enabled: true
      remote_desktop:
        just_in_time_node_access:
          enabled: true
          target_regions: "us-east-1"
        recording:
          enabled: true
  ```

  To set just-in-time node access up across the organization instead, turn `organization_level` on and
  name the organizational units. Apply that from the Systems Manager delegated administrator account:

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      remote_desktop:
        just_in_time_node_access:
          enabled: true
          organization_level: true
          target_organizational_units: "ou-abcd-11111111,ou-abcd-22222222"
          target_regions: "us-east-1"
        recording:
          enabled: true
  ```

  Recording requires a symmetric encrypt/decrypt customer managed key. For an external destination,
  grant GUI Connect `s3:PutObject` in the bucket policy. For an SSE-KMS destination, use a customer
  managed bucket key that grants GUI Connect `kms:GenerateDataKey` through S3.
  [AWS recording destination requirements](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-rdp-recording.html)

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      remote_desktop:
        just_in_time_node_access:
          enabled: true
        recording:
          enabled: true
          bucket_name: "my-central-rdp-recordings"
          bucket_owner: "123456789012"
          kms_key_arn: "arn:aws:kms:us-east-1:123456789012:key/abcd1234-..."
  ```

  Connection duration, idle timeout and concurrency follow the service's Remote Desktop limits.

  - **Recordings are not covered by the audit lifecycle rule.** The preferences schema carries no key
    prefix, so the module cannot scope a rule to them; video recordings will accumulate until you add
    your own lifecycle policy.
  - **Recorded connections require additional permissions.** Use the AWS recording IAM permissions
    for the deployer and the operator's GUI Connect actions. You can grant `kms:CreateGrant` on the
    module-created recording key through `settings.create_grant_iam_role_names`. When using an external
    recording key, configure its tag and grant permissions separately. After disconnecting, verify
    that the recording reaches `Finished` and appears in the destination bucket.
    [AWS recording IAM permissions and status](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-just-in-time-node-access-rdp-recording.html)

  ### Granting administrative roles full access to the audit bucket

  `settings.allowed_iam_role_names` grants the write-only pair the instance roles need. Roles that have to
  read, list or clean up session logs go in `settings.admin_iam_role_names` instead, which grants full
  object access on the bucket. Both accept exact names and `*` / `?` wildcards, resolved at plan time.

  ```yaml
  settings:
    allowed_iam_role_names:
      - "ssm-instance-*"
    admin_iam_role_names:
      - "SecurityAudit"
      - "breakglass-*"
    admin_iam_role_arns:
      - "arn:aws:iam::123456789012:role/central-audit-reader"
  ```

  `admin_iam_role_arns` is merged with whatever `admin_iam_role_names` resolves to, exactly as
  `allowed_iam_role_arns` is merged into the write tier. Use it for roles in another account, which cannot
  be resolved by name from here.

  The grant is enumerated rather than `s3:*`:

  | Purpose | Actions |
  |---------|---------|
  | Read | `s3:GetObject`, `s3:GetObjectVersion`, `s3:GetObjectAttributes`, `s3:GetObjectVersionAttributes` |
  | Create | `s3:PutObject` |
  | Delete | `s3:DeleteObject`, `s3:DeleteObjectVersion` |
  | Multipart | `s3:AbortMultipartUpload`, `s3:ListMultipartUploadParts`, `s3:ListBucketMultipartUploads` |
  | List | `s3:ListBucket`, `s3:ListBucketVersions`, `s3:GetBucketLocation` |
  | Encryption | `s3:GetEncryptionConfiguration` |

  Because the bucket is SSE-KMS encrypted, those S3 actions on their own cannot read an object body or
  write a new one, so these roles are also added to the KMS key policy with the same data plane actions the
  write roles get: `kms:Encrypt`, `kms:Decrypt`, `kms:ReEncrypt*`, `kms:GenerateDataKey*` and
  `kms:Describe*`.

  What is deliberately **excluded**, and why `s3:*` is not used: `s3:PutBucketPolicy` and
  `s3:DeleteBucketPolicy` would let an audit reader rewrite this very policy and remove the TLS and
  transport denies; `s3:PutEncryptionConfiguration` would let them weaken or repoint the bucket's
  encryption; `s3:PutLifecycleConfiguration` would let them shorten the retention the bucket exists to
  guarantee; and `s3:DeleteBucket` speaks for itself. On the KMS side they are likewise not granted
  `kms:*`, which would allow rewriting the key policy or scheduling the key for deletion.

  If a role genuinely needs those bucket-administration actions, grant them through that role's own
  identity policy rather than widening this statement for every admin principal.

  An entry made only of wildcards is rejected — `"*"` would hand every role in the account full access to
  the audit logs.

  ### Granting kms:CreateGrant to specific roles

  Some Systems Manager features do not use the KMS key directly. They ask another AWS service to use it
  on the caller's behalf, and AWS implements that hand-off as a *grant* — so the caller needs
  `kms:CreateGrant` on the key. Just-in-Time node access and Remote Desktop session recording both work
  this way: an operator with every S3 and KMS data plane action still cannot start a recorded connection
  without it.

  `settings.create_grant_iam_role_names` grants exactly that one action, and nothing else:

  ```yaml
  settings:
    create_grant_iam_role_names:
      - "rdp-operator-*"
      - "JustInTimeNodeAccessOperator"
    create_grant_iam_role_arns:
      - "arn:aws:iam::123456789012:role/central-jit-operator"
  ```

  This list is **key policy only**. It grants no access to the audit bucket and none of the
  `kms:Encrypt` / `kms:Decrypt` / `kms:GenerateDataKey*` actions the other two tiers get. A role that also
  has to read the recordings it produced belongs in `settings.admin_iam_role_names` as well — the lists
  are independent, and listing a role in both is the supported way to give it both grants.

  Grant *management* is deliberately not included: `kms:ListGrants` and `kms:RevokeGrant` are not granted,
  so a role here can create a grant but cannot enumerate or revoke the grants on the key. That is the
  right shape for the service hand-off this exists for, since the AWS service retires its own grant when
  the connection ends. Add those actions through the role's own identity policy if you need an operator
  to audit or clean up grants by hand.

  It is kept separate from the write and admin tiers on purpose. `kms:CreateGrant` is the one data plane
  action that widens *who else* may use the key: a role holding it can delegate key use to another
  principal without touching the key policy. Every instance role writing session logs would otherwise
  inherit that, which is not what the write tier is for.

  `kms:*` is still never granted, so these roles cannot rewrite the key policy or schedule the key for
  deletion. The same wildcard rules as the other lists apply, and an entry made only of wildcards is
  rejected.

  ### Quick Setup host management and patch scanning for the whole account

  Targets every instance in this account and Region. `target_type: "*"` is the local-account form; no
  organizational units are involved, so this can be applied from any account.

  ```yaml
  settings:
    host_management:
      enabled: true
      target_type: "*"
      update_ssm_agent: true
      collect_inventory: true
      scan_instances: true
      install_cloudwatch_agent: true

    patch:
      enabled: true
      target_type: "*"
      operation: "Scan"
      scan_value: "cron(0 1 * * ? *)"
  ```

  Note that `host_management.collect_inventory` and `settings.fleet_manager.inventory` both create an
  inventory association, and Systems Manager permits only one per node. Pick whichever fits — the Quick
  Setup block for a fleet-wide rollout, the Fleet Manager block when the association needs its own
  schedule, targets or collection categories.

  ### Quick Setup patch policy that installs, targeted by tag

  ```yaml
  settings:
    patch:
      enabled: true
      policy_name: "prod-linux-patching"
      operation: "ScanAndInstall"
      scan_value: "cron(0 1 * * ? *)"
      install_value: "cron(0 3 ? * SUN *)"
      reboot_option: "RebootIfNeeded"
      rate_control_concurrency: "10%"
      rate_control_error_threshold: "2%"
      target_type: "Tags"
      target_tag_key: "PatchGroup"
      target_tag_value: "production"
  ```

  `operation` accepts only `Scan` and `ScanAndInstall`. The install schedule is sent to AWS solely under
  `ScanAndInstall`, and falls back to `scan_value` when `install_value` is omitted.

  ### Quick Setup across organizational units

  Applied from the Quick Setup delegated administrator account. `target_type` is left unset — supplying it
  alongside `target_organizational_units` is rejected.

  ```yaml
  settings:
    dhmc:
      enabled: true
      target_organizational_units: "ou-abcd-11111111,ou-abcd-22222222"
      target_regions: "us-east-1,us-west-2"

    host_management:
      enabled: true
      target_organizational_units: "ou-abcd-11111111,ou-abcd-22222222"
      target_regions: "us-east-1,us-west-2"
      collect_inventory: true
  ```

  ### Object ownership and Remote Desktop recordings

  The audit bucket is created with `ObjectOwnership: BucketOwnerEnforced`, which disables ACLs and makes
  the bucket owner the owner of every object regardless of who uploaded it.

  This is not cosmetic. Under the previous `BucketOwnerPreferred` setting, the bucket owner only took
  ownership when the uploader supplied the `bucket-owner-full-control` ACL, and the GUI Connect service
  that uploads Remote Desktop recordings does not supply one. Those recordings ended up owned by an AWS
  service account, and **a bucket policy cannot grant access to objects the bucket owner does not own** —
  object ACLs govern, and only the object owner can change them. The result was a recording that uploaded
  successfully, at full size, that nobody in the account could ever read. No bucket policy grant fixed it,
  including everything `settings.admin_iam_role_names` grants, because S3 denied the request at authorization
  before it ever reached the object.

  Two consequences worth knowing:

  - **Ownership is not retroactive.** Recordings written before this change remain owned by the service
    account and stay unreadable permanently. The bucket owner can delete them, but never read them. Only
    recordings written after the change are accessible.
  - **ACLs are disabled on the bucket.** Nothing in this module sets one, and the resource data sync grant
    no longer requires the `bucket-owner-full-control` canned ACL — `aws:SourceAccount` and `aws:SourceArn`
    remain the constraints on that statement. If you attach your own policy or tooling that sets an object
    ACL, it will fail with `AccessControlListNotSupported`.

  ### Delegation mode

  Applied against the Organizations management account. Creates only the delegated administrator
  registrations for SSM, SSM Quick Setup, CloudFormation StackSets and Resource Explorer.

  ```yaml
  settings:
    organization:
      delegated: true
      account_id: "123456789012"
  ```

# How to get started quickly
quickstart: |-
  1. Create the deployment directory and run `terragrunt scaffold github.com/cloudopsworks/terraform-module-aws-ssm-session-management` inside it.
  2. Edit `inputs.yaml`; the defaults are usable as-is for a first deployment.
  3. Add the instance roles that will write session logs under `settings.allowed_iam_role_names`, or turn on
     `settings.fleet_manager.default_host_management` to adopt the fleet without instance profiles instead.
     To roll the same adoption out across organizational units, use `settings.dhmc` instead, and add
     `settings.host_management` or `settings.patch` for agent updates, inventory and patching.
     Roles that need to read or clean up the logs rather than write them go under
     `settings.admin_iam_role_names`, and roles that start Just-in-Time or recorded Remote Desktop
     connections go under `settings.create_grant_iam_role_names`.
  4. Run `terragrunt plan` to review the resources to be created.
  5. Run `terragrunt apply` to deploy the configuration.

