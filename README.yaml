description: |-
  This module sets up AWS SSM Session Manager and Fleet Manager settings, including S3 bucket for audit logs, CloudWatch Log Group, KMS encryption for both, Default Host Management Configuration, Inventory collection, resource data sync and Remote Desktop connection recording. It also drives SSM Quick Setup configuration managers for Default Host Management, Host Management and Patch Policy, across a single account or a set of organizational units.

# Introduction to the project
introduction: |-
  The AWS SSM Session Management module provides a standardized way to configure Session Manager across an organization.
  It ensures that all sessions are logged to a secure S3 bucket and optionally to CloudWatch Logs, with all data encrypted using a KMS key.

  The module creates a regional `SSM-SessionManagerRunShell` Session document holding the Session Manager
  preferences, an encrypted S3 bucket with a tiered lifecycle policy for audit logs, an optional CloudWatch
  log group, and the KMS key protecting both. Roles that need to write audit logs may be granted access by
  ARN or by role name.

  Under `settings.fleet_manager` the module also configures the Fleet Manager side of Systems Manager.
  All of it is opt-in and account and Region wide:

  - **Default Host Management Configuration** creates the service role Systems Manager assumes and flips
    the `/ssm/managed-instance/default-ec2-instance-management-role` service setting, so every EC2
    instance in the account and Region becomes a managed node without an instance profile. The role is
    also granted write access to this module's audit bucket, KMS key and log group, so nodes adopted this
    way can log their sessions without further configuration.
  - **Inventory collection** creates the `AWS-GatherSoftwareInventory` association that populates the
    Fleet Manager node detail views.
  - **Resource data sync** aggregates that Inventory into S3 for querying with Athena, defaulting to the
    audit bucket this module already manages and adding the bucket policy and KMS grants the service
    requires.

  - **Remote Desktop connection recording** records RDP connections to S3. This is the only separately
    configurable Remote Desktop setting — a connection otherwise applies the same Session Manager
    preferences written to the `SSM-SessionManagerRunShell` document. It requires just-in-time node
    access, which this module cannot enable; see the caveat below.

  Recording preferences are exposed only through Cloud Control, so the module also requires the `awscc`
  provider. Nothing from that provider is created unless recording is turned on.

  **The `awscc` provider has to be configured with the same Region and role as `aws`.** It is a separate
  provider with its own credential and Region resolution, so a Terragrunt `root.hcl` that generates only an
  `aws` provider block leaves `awscc` falling back to `AWS_REGION` and the default profile. Because Cloud
  Control is a regional API, a mismatch does not fail loudly — it reads an empty result, which surfaces as
  `Cannot import non-existent remote object` when importing existing preferences, or as a plan that wants to
  create `awscc_ssmguiconnect_preferences` even though the account already has them, and then fails on apply.
  The scaffolded `terragrunt.hcl` generates the matching `awscc` provider block for this reason.

  Note that `awscc` is plugin-framework based, so its `assume_role` is a nested attribute assigned with `=`,
  not a block as in the `aws` provider.

  These recording preferences are also a **singleton per AWS account** — `account_id` is the resource's whole
  identifier. Only one deployment in an account can own `awscc_ssmguiconnect_preferences`; a second one
  enabling recording will collide with the first and the two will overwrite each other's bucket and key.

  Separately from `settings.fleet_manager`, the top level `settings.dhmc`, `settings.host_management` and
  `settings.patch` blocks drive **SSM Quick Setup** configuration managers. Where the Fleet Manager block
  creates individual resources in this account and Region, Quick Setup hands a configuration to Systems
  Manager and lets it deploy and maintain the underlying StackSets, associations and roles:

  - **`settings.dhmc`** rolls Default Host Management Configuration out across organizational units, so
    every EC2 instance in them becomes a managed node without an instance profile. This is the
    organization-wide counterpart to `settings.fleet_manager.default_host_management`, which configures the
    same feature in the current account only. Use one or the other, not both.
  - **`settings.host_management`** configures SSM Agent and EC2 Launch agent updates, inventory collection,
    daily patch scanning and the CloudWatch agent on the targeted instances.
  - **`settings.patch`** creates a Patch Policy that scans, or scans and installs, missing patches on a cron
    schedule against the AWS provided patch baselines resolved at plan time.

  Each of the three targets either the current account — through `target_type`, which selects every
  instance, an instance ID list, a tag pair or a resource group — or a set of organizational units through
  `target_organizational_units`. The two are mutually exclusive, and an organization-wide deployment has to
  be applied from the Quick Setup delegated administrator account, which delegation mode below registers.
  `settings.patch` additionally depends on the `AWS-QuickSetup-PatchPolicy` local deployment roles existing
  in the target account.

  It also runs in a second, mutually exclusive mode: when `settings.organization.delegated` is `true` the
  module creates **only** the SSM delegated administrator registrations in the Organizations management
  account, and none of the session logging or Fleet Manager resources.

# How to use this project
usage: |-
  This module is consumed through Terragrunt. Bootstrap a deployment with the built-in scaffold command,
  which sources `.boilerplate/boilerplate.yml` to generate `terragrunt.hcl`, `inputs.yaml` and
  `local-tags.json` in the current directory.

  ```sh
  # 1. Create and enter the target deployment directory
  mkdir -p <environment>/<region>/<spoke>/ssm-session-management
  cd <environment>/<region>/<spoke>/ssm-session-management

  # 2. Scaffold the module (do NOT use --working-dir)
  terragrunt scaffold github.com/cloudopsworks/terraform-module-aws-ssm-session-management

  # 3. Edit inputs.yaml with deployment-specific values
  #    (all keys and comments are pre-populated from .boilerplate/inputs.yaml)
  vi inputs.yaml

  # 4. Apply
  terragrunt apply
  ```

  ### Generated `inputs.yaml`

  Every key is optional; the defaults shown are what the module applies when a key is omitted.

  ```yaml
  # Module configuration
  settings:
    # random_bucket_suffix: true                    # (Optional) Deprecated, use bucket.random_suffix instead. Default: true
    # allowed_iam_role_arns: []                     # (Optional) IAM role ARNs allowed to write to the audit bucket and use the KMS key. Default: []
    # allowed_iam_role_names: []                    # (Optional) IAM role names in the current account, resolved to ARNs and merged with allowed_iam_role_arns. Supports "*" and "?" wildcards, e.g. "ssm-*" or "*-instance-role". Resolved by listing roles at plan time, so a role created later that matches an existing pattern is picked up on the next plan. Each entry must contain at least one literal character. Default: []

    # organization:                                 # (Optional) Delegation mode. When delegated is true ONLY the delegated administrator registrations are created — no bucket, key, log group or session document.
    #   delegated: false                            # (Optional) Run in delegation mode. Must be applied against the Organizations management account. Default: false
    #   account_id: "123456789012"                  # (Required when delegated is true) Account ID to register as SSM delegated administrator.

    bucket:                                         # (Optional) Audit log S3 bucket settings
      # name: ""                                    # (Optional) Explicit bucket name, 3-63 characters. When set, no name is generated and no random suffix is added. Default: "" (generates "ssm-session-auditlogs-<system-name>")
      random_suffix: true                           # (Optional) Append a random 8 character suffix to the generated bucket name. Ignored when name is set. Default: true
      # versioning: false                           # (Optional) Enable versioning on the audit bucket. Default: false

    kms:                                            # (Optional) KMS configuration for encryption
      enabled: true                                 # (Optional) Create a new KMS key for session data. Default: true
      # key_alias: ""                               # (Optional) Existing KMS key alias to use when enabled is false. Default: ""
      # key_id: ""                                  # (Optional) Existing KMS key ID to use when enabled is false. Default: ""
      # deletion_window: 30                         # (Optional) Deletion window in days for the created key. Default: 30
      # enable_key_rotation: true                   # (Optional) Enable automatic key rotation. Default: true
      # rotation_period_in_days: 90                 # (Optional) Rotation period in days. Default: 90
      # multi_region: false                         # (Optional) Create the key as multi-region. Default: false
      # alias_name: "ssm-session-mgmt-key"          # (Optional) Alias name for the created key, without the "alias/" prefix. Default: "ssm-session-mgmt-key-<system-name>"

    session:                                        # (Optional) Session Manager preferences written to the SSM-SessionManagerRunShell document
      # run_as: ""                                  # (Optional) OS user to run the session as. Default: ""
      # run_as_enabled: false                       # (Optional) Whether Session Manager honours run_as. Default: true when run_as is non-empty, false otherwise
      timeout: 20                                   # (Optional) Idle session timeout in minutes, valid values 1-60. Default: 20
      max_duration: 60                              # (Optional) Maximum session duration in minutes, valid values 1-1440. Default: 60
      # shell_profile:                              # (Optional) Commands run at session start, per platform
      #   linux: ""                                 # (Optional) Shell commands to run when a Linux session starts. Default: ""
      #   windows: ""                               # (Optional) Shell commands to run when a Windows session starts. Default: ""

    audit:                                          # (Optional) Audit log retention settings for S3
      # s3_key_prefix: "session-manager/"           # (Optional) Key prefix for session logs written to the bucket. The lifecycle rule below is scoped to this prefix, so other data sharing the bucket is left alone. Default: "session-manager/"
      transition_days: 30                           # (Optional) Days before transitioning logs to STANDARD_IA. STANDARD_IA bills a 128 KB minimum per object, which can cost more than STANDARD for small session logs. Default: 30
      archive_days: 60                              # (Optional) Days before transitioning logs to GLACIER. Default: 60
      retention_years: 5                            # (Optional) Years to retain logs before expiration. Default: 5
      # abort_multipart_days: 7                     # (Optional) Days before aborting incomplete multipart uploads. Default: 7

    cloudwatch:                                     # (Optional) CloudWatch logging settings
      enabled: false                                # (Optional) Enable CloudWatch logging of sessions. Default: false
      # retention: 7                                # (Optional) Log retention in days. Default: 7
      # streaming: false                            # (Optional) Stream session output continuously instead of writing on session end. Default: false

    # fleet_manager:                                # (Optional) Fleet Manager settings. All of these are account and Region wide, and are ignored in delegation mode.
    #   enabled: false                              # (Optional) Master toggle for this whole block. Nothing below is created unless this is true. Default: false
    #
    #   default_host_management:                    # (Optional) Default Host Management Configuration — lets Systems Manager manage every EC2 instance in this account and Region as a managed node, with no instance profile.
    #     enabled: false                            # (Optional) Turn on Default Host Management Configuration. Instances need IMDSv2 and SSM Agent 3.2.582.0 or later. Default: false
    #     create_role: true                         # (Optional) Create the IAM role. Set to false to point the setting at a role managed elsewhere. Default: true
    #     role_name: ""                             # (Optional) Name of the IAM role Systems Manager assumes. Default: "AWSSystemsManagerDefaultEC2InstanceManagementRole"
    #     role_path: "/service-role/"               # (Optional) IAM path of that role, leading and trailing slash included. Default: "/service-role/"
    #     additional_policy_arns: []                # (Optional) Extra managed policy ARNs attached to the created role. These apply to every managed instance in the Region. Default: []
    #     session_logging_access: true              # (Optional) Attach an inline policy letting managed nodes write session logs to this module's audit bucket, KMS key and log group. Ignored when create_role is false. Default: true
    #
    #   inventory:                                  # (Optional) Inventory collection — populates the Fleet Manager node detail views. Systems Manager permits only one inventory association per node.
    #     enabled: false                            # (Optional) Create the AWS-GatherSoftwareInventory association. Default: false
    #     schedule: "rate(1 day)"                   # (Optional) Rate or cron expression for the collection schedule, minimum 30 minutes. Default: "rate(1 day)"
    #     association_name: ""                      # (Optional) Name of the State Manager association, 3-128 characters of [A-Za-z0-9_.-]. Default: "ssm-inventory-<system-name>"
    #     apply_only_at_cron_interval: false        # (Optional) Skip the immediate run on apply and wait for the first scheduled interval. Default: false
    #     max_concurrency: ""                       # (Optional) Nodes to run against at once, as a number or a percentage such as "10%". Default: "" (unset, AWS decides)
    #     max_errors: ""                            # (Optional) Errors tolerated before the association stops, as a number or a percentage. Default: "" (unset, AWS decides)
    #     targets:                                  # (Optional) Up to 5 target blocks. Default: every managed node, as below.
    #       - key: "InstanceIds"                    # (Required within targets) Target key, e.g. "InstanceIds", "tag:Environment", "resource-groups:Name".
    #         values: ["*"]                         # (Required within targets) Values for that key.
    #     applications: "Enabled"                   # (Optional) Collect installed application metadata. Values: Enabled, Disabled. Default: "Enabled"
    #     aws_components: "Enabled"                 # (Optional) Collect AWS component metadata such as amazon-ssm-agent. Values: Enabled, Disabled. Default: "Enabled"
    #     custom_inventory: "Enabled"               # (Optional) Collect custom inventory metadata. Values: Enabled, Disabled. Default: "Enabled"
    #     instance_detailed_information: "Enabled"  # (Optional) Collect CPU model, speed and core count. Values: Enabled, Disabled. Default: "Enabled"
    #     network_config: "Enabled"                 # (Optional) Collect network configuration metadata. Values: Enabled, Disabled. Default: "Enabled"
    #     services: "Enabled"                       # (Optional) Collect Windows service configuration. Windows only. Values: Enabled, Disabled. Default: "Enabled"
    #     windows_roles: "Enabled"                  # (Optional) Collect Windows roles. Windows only. Values: Enabled, Disabled. Default: "Enabled"
    #     windows_updates: "Enabled"                # (Optional) Collect installed Windows updates. Windows only. Values: Enabled, Disabled. Default: "Enabled"
    #     files: ""                                 # (Optional) JSON string selecting files to inventory. Only sent when non-empty. Default: ""
    #     windows_registry: ""                      # (Optional) JSON string selecting Windows registry keys to inventory. Only sent when non-empty. Default: ""
    #
    #   remote_desktop:                           # (Optional) Fleet Manager Remote Desktop. Connections otherwise inherit the Session Manager preferences configured above — recording is the only separately configurable setting.
    #     recording:                              # (Optional) RDP connection recording, uploaded to S3 by the ssm-guiconnect service principal.
    #       enabled: false                        # (Optional) Record RDP connections. Requires a symmetric customer managed KMS key AND just-in-time node access already enabled. Default: false
    #       just_in_time_node_access_enabled: false # (Required when enabled is true) Confirms just-in-time node access is already enabled here. Recording is a JIT feature; JIT is enabled console-only from the Organizations delegated administrator account, needs the unified Systems Manager console, is billed after a 30 day trial, and cannot be turned on by Terraform. Default: false
    #       bucket_name: ""                       # (Optional) Destination bucket. Leave empty to use this module's audit bucket, in which case the required bucket policy statement and KMS grant are added automatically. Default: ""
    #       bucket_owner: ""                      # (Optional) Account ID owning the destination bucket. Default: "" (the current account)
    #       kms_key_arn: ""                       # (Optional) Symmetric encrypt/decrypt customer managed key used to encrypt the recording while Systems Manager processes it. Default: "" (this module's key)
    #
    #   resource_data_sync:                         # (Optional) Aggregates the collected Inventory into an S3 bucket so it can be queried with Athena.
    #     enabled: false                            # (Optional) Create the resource data sync. Default: false
    #     name: ""                                  # (Optional) Name of the sync. Default: "ssm-inventory-<system-name>"
    #     bucket_name: ""                           # (Optional) Destination bucket. Leave empty to use this module's own audit bucket, in which case the required bucket policy statements and KMS grants are added automatically. Default: ""
    #     prefix: "inventory"                       # (Optional) Key prefix for the synchronised data. Set to "" to write at the bucket root. Default: "inventory"
    #     region: ""                                # (Optional) Region of the destination bucket. Default: "" (the region this module is applied in)
    #     kms_key_arn: ""                           # (Optional) KMS key ARN used to encrypt the synchronised data. Default: "" (this module's key when the audit bucket is the destination)

    # ---------------------------------------------------------------------------------
    # SSM Quick Setup configuration managers.
    #
    # These three blocks are independent of fleet_manager above: they deploy AWS Systems
    # Manager Quick Setup configurations rather than individual resources, and each one can
    # target this account or a set of organizational units. All are ignored in delegation
    # mode. Organization-wide deployments must be applied from the Quick Setup delegated
    # administrator account — the account registered through settings.organization.
    # ---------------------------------------------------------------------------------

    # dhmc:                                         # (Optional) Quick Setup Default Host Management Configuration (AWSQuickSetupType-DHMC). Rolls DHMC out across organizational units, so every EC2 instance in them becomes a managed node without an instance profile.
    #   enabled: false                              # (Optional) Create the DHMC Quick Setup configuration manager. Default: false
    #   update_ssm_agent: true                      # (Optional) Update SSM Agent on target instances every two weeks. Default: true
    #   target_organizational_units: "ou-abcd-1111" # (Required when enabled is true) Comma separated list of organizational unit IDs to deploy to. DHMC has no local-account targeting mode.
    #   target_regions: "us-east-1"                 # (Optional) Comma separated list of regions to deploy to. Default: "" (the region this module is applied in)

    # host_management:                              # (Optional) Quick Setup Host Management (AWSQuickSetupType-SSMHostMgmt). Configures agent updates, inventory collection, patch scanning and the CloudWatch agent on the targeted instances.
    #   enabled: false                              # (Optional) Create the Host Management Quick Setup configuration manager. Default: false
    #   update_ssm_agent: true                      # (Optional) Update SSM Agent on target instances every two weeks. Default: true
    #   update_ec2_launch_agent: false              # (Optional) Update the EC2 Launch agent monthly. Windows only. Default: false
    #   collect_inventory: true                     # (Optional) Collect instance metadata every 30 minutes. Do not combine with fleet_manager.inventory — Systems Manager permits only one inventory association per node. Default: true
    #   scan_instances: true                        # (Optional) Scan target instances daily for missing patches. Default: true
    #   install_cloudwatch_agent: false             # (Optional) Install the CloudWatch agent on target instances. Default: false
    #   update_cloudwatch_agent: false              # (Optional) Update the CloudWatch agent monthly. Default: false
    #   is_policy_attach_allowed: false             # (Optional) Allow Quick Setup to attach policies to instance profiles already associated with the target instances. Default: false
    #   #
    #   # Targeting: use EITHER target_type (local account) OR target_organizational_units
    #   # (organization). Supplying both is rejected.
    #   target_type: "*"                            # (Optional) How instances are targeted in this account. Values: "*" (every instance), InstanceIds, Tags, ResourceGroups. Leave unset when deploying to OUs. Default: "" (unset)
    #   target_instances: "i-1234567890abcdef0"     # (Required when target_type is InstanceIds) Comma separated list of instance IDs.
    #   target_tag_key: "Environment"               # (Required when target_type is Tags) Tag key assigned to the instances to target.
    #   target_tag_value: "production"              # (Required when target_type is Tags) Value of that tag key.
    #   resource_group_name: "my-group"             # (Required when target_type is ResourceGroups) Name of the resource group holding the instances to target.
    #   target_organizational_units: "ou-abcd-1111" # (Optional) Comma separated list of organizational unit IDs to deploy to. Mutually exclusive with target_type. Default: ""
    #   target_accounts: "123456789012"             # (Optional) Comma separated list of account IDs for a local deployment. Default: ""
    #   target_regions: "us-east-1"                 # (Optional) Comma separated list of regions to deploy to. Default: "" (the region this module is applied in)

    # patch:                                        # (Optional) Quick Setup Patch Policy (AWSQuickSetupType-PatchPolicy). Quick Setup must already have created the AWS-QuickSetup-PatchPolicy local deployment roles in this account — configure a patch policy once from the console, or let this module create the first one.
    #   enabled: false                              # (Optional) Create the Patch Policy Quick Setup configuration manager. Default: false
    #   policy_name: ""                             # (Optional) Name of the patch policy, also applied to target instances as a tag. Default: "" (the short system name)
    #   operation: "Scan"                           # (Optional) Whether instances only scan for patches, or scan and install them. Values: Scan, ScanAndInstall. Default: "Scan"
    #   scan_value: "cron(0 1 * * ? *)"             # (Optional) Cron expression scheduling the patch scan. Default: "cron(0 1 * * ? *)"
    #   scan_next_interval: false                   # (Optional) Scan at the next cron interval instead of waiting a full cycle. Default: false
    #   install_value: "cron(0 2 * * ? *)"          # (Optional) Cron expression scheduling the patch install. Only sent when operation is ScanAndInstall. Default: "" (falls back to scan_value)
    #   install_next_interval: false                # (Optional) Install at the next cron interval. Only sent when operation is ScanAndInstall. Default: false
    #   reboot_option: "RebootIfNeeded"             # (Optional) Whether instances reboot after patches install. Values: RebootIfNeeded, NoReboot. Default: "" (unset, AWS decides)
    #   default_baselines: true                     # (Optional) Restrict the patch baseline lookup to AWS default baselines. Default: true
    #   baseline_use: "default"                     # (Optional) Whether the selected baselines are all AWS provided. Values: default, custom. Default: "default"
    #   baseline_region: "us-east-1"                # (Optional) Region where the patch baselines exist. Default: "" (the region this module is applied in)
    #   rate_control_concurrency: "10%"             # (Optional) Instances patched at once, as a number or a percentage. Default: "10%"
    #   rate_control_error_threshold: "2%"          # (Optional) Errors tolerated before the deployment stops, as a number or a percentage. Default: "2%"
    #   is_policy_attach_allowed: false             # (Optional) Allow Quick Setup to attach policies to instance profiles already associated with the target instances. Default: false
    #   output_s3_bucket_name: ""                   # (Optional) Bucket receiving patch command output logs. Output logging is enabled only when this is set. This module neither creates that bucket nor grants access to it. Default: "" (logging disabled)
    #   output_s3_bucket_region: ""                 # (Optional) Region of that bucket. Default: "" (the region this module is applied in)
    #   output_s3_key_prefix: ""                    # (Optional) Key prefix used within that bucket. Default: ""
    #   #
    #   # Targeting behaves exactly as documented under host_management above.
    #   target_type: "*"                            # (Optional) How instances are targeted in this account. Values: "*", InstanceIds, Tags, ResourceGroups. Leave unset when deploying to OUs. Default: "" (unset)
    #   target_instances: "i-1234567890abcdef0"     # (Required when target_type is InstanceIds) Comma separated list of instance IDs.
    #   target_tag_key: "Environment"               # (Required when target_type is Tags) Tag key assigned to the instances to target.
    #   target_tag_value: "production"              # (Required when target_type is Tags) Value of that tag key.
    #   resource_group_name: "my-group"             # (Required when target_type is ResourceGroups) Name of the resource group holding the instances to target.
    #   target_organizational_units: "ou-abcd-1111" # (Optional) Comma separated list of organizational unit IDs to deploy to. Mutually exclusive with target_type. Default: ""
    #   target_accounts: "123456789012"             # (Optional) Comma separated list of account IDs for a local deployment. Default: ""
    #   target_regions: "us-east-1"                 # (Optional) Comma separated list of regions to deploy to. Default: "" (the region this module is applied in)
  ```

  ### Generated `terragrunt.hcl`

  Scaffold renders the file below; `inputs.yaml` is loaded as `local.local_vars` and each module variable is
  wired into the `inputs` block. The `org`, `spoke_def` and `extra_tags` values come from the Terragrunt
  hierarchy, not from `inputs.yaml`.

  ```hcl
  locals {
    local_vars  = yamldecode(file("./inputs.yaml"))
    spoke_vars  = yamldecode(file(find_in_parent_folders("spoke-inputs.yaml")))
    region_vars = yamldecode(file(find_in_parent_folders("region-inputs.yaml")))
    env_vars    = yamldecode(file(find_in_parent_folders("env-inputs.yaml")))
    global_vars = yamldecode(file(find_in_parent_folders("global-inputs.yaml")))

    local_tags  = jsondecode(file("./local-tags.json"))
    spoke_tags  = jsondecode(file(find_in_parent_folders("spoke-tags.json")))
    region_tags = jsondecode(file(find_in_parent_folders("region-tags.json")))
    env_tags    = jsondecode(file(find_in_parent_folders("env-tags.json")))
    global_tags = jsondecode(file(find_in_parent_folders("global-tags.json")))

    tags = merge(
      local.global_tags,
      local.env_tags,
      local.region_tags,
      local.spoke_tags,
      local.local_tags
    )
  }

  include "root" {
    path = find_in_parent_folders("root.hcl")
    # Exposes the root config so the awscc provider below can reuse its region and role.
    expose = true
  }

  # root.hcl generates the aws provider only; awscc needs the same region and role.
  generate "provider_awscc" {
    path      = "provider-awscc.g.tf"
    if_exists = "overwrite_terragrunt"
    contents  = <<EOF
  provider "awscc" {
    region = "${include.root.locals.region}"
    assume_role = {
      role_arn     = "${include.root.locals.sts_role_arn}"
      session_name = "terragrunt"
    }
  }
  EOF
  }

  terraform {
    source = "git::https://github.com/cloudopsworks/terraform-module-aws-ssm-session-management.git?ref=v1.1.0"
  }

  inputs = {
    is_hub     = false
    org        = local.env_vars.org
    spoke_def  = local.spoke_vars.spoke
    settings   = try(local.local_vars.settings, {})
    extra_tags = local.tags
  }
  ```

# Example usage
examples: |-
  ### Minimal

  Leave `inputs.yaml` at its defaults. The module creates the audit bucket with a random suffix, a customer
  managed KMS key, and the Session document. CloudWatch logging stays off.

  ```yaml
  settings:
    kms:
      enabled: true
  ```

  ### CloudWatch logging with a longer retention

  ```yaml
  settings:
    cloudwatch:
      enabled: true
      retention: 30
      streaming: true
    kms:
      enabled: true
      deletion_window: 7
      rotation_period_in_days: 180
    audit:
      retention_years: 7
  ```

  ### Granting instance roles access to the audit bucket

  Roles may be given as ARNs, as plain names resolved in the current account, or both. The two lists are
  merged and de-duplicated.

  ```yaml
  settings:
    allowed_iam_role_names:
      - "ec2-ssm-managed-instance-role"
      - "bastion-instance-role"
    allowed_iam_role_arns:
      - "arn:aws:iam::123456789012:role/cross-account-session-role"
  ```

  Names may also use `*` and `?` wildcards. Because neither character is legal in an IAM role name, an
  entry containing either is treated as a pattern; everything else is matched exactly.

  ```yaml
  settings:
    allowed_iam_role_names:
      - "ssm-*"                 # every role whose name starts with "ssm-"
      - "*-instance-role"       # every role whose name ends with "-instance-role"
      - "ec2-?-worker"          # "?" matches exactly one character
      - "bastion-instance-role" # no wildcard, matched exactly
  ```

  Patterns are anchored, so `ssm-*` matches `ssm-session-role` but not `my-ssm-session-role`.

  Two behaviours to be aware of when using wildcards:

  - **Membership is re-evaluated on every plan.** Terraform lists the account's roles and filters them,
    so a role created later that matches an existing pattern is added to the bucket and KMS key policies
    on the next apply, with no change to this configuration. Exact names do not behave this way.
  - **A pattern that matches nothing is silent.** A misspelled exact name fails the plan; a misspelled
    pattern simply grants no access. Check the `allowed_iam_role_arns` output to see what actually resolved.

  Wildcards require `iam:ListRoles` in addition to the `iam:GetRole` needed for exact names. A pattern
  made up only of wildcards is rejected, since it would match every role in the account.

  ### Reusing an existing KMS key

  ```yaml
  settings:
    kms:
      enabled: false
      key_alias: "alias/my-existing-session-key"
  ```

  ### Running a start-up command in every session

  ```yaml
  settings:
    session:
      run_as: "ec2-user"
      run_as_enabled: true
      timeout: 15
      max_duration: 120
      shell_profile:
        linux: "cd /var/log && echo 'Session started'"
  ```

  ### Adopting a fleet with Default Host Management Configuration

  Turns every EC2 instance in this account and Region into a managed node without an instance profile,
  and grants the role Systems Manager assumes write access to this module's audit bucket, KMS key and log
  group. Instances must run IMDSv2 and SSM Agent 3.2.582.0 or later; an instance profile that already
  allows `ssm:UpdateInstanceInformation` takes precedence and keeps that instance off DHMC.

  ```yaml
  settings:
    cloudwatch:
      enabled: true
    fleet_manager:
      enabled: true
      default_host_management:
        enabled: true
        additional_policy_arns:
          - "arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy"
  ```

  With this in place `settings.allowed_iam_role_names` is usually unnecessary — the nodes get their audit
  bucket access from the Default Host Management Configuration role rather than from an instance profile.

  ### Inventory collection and resource data sync

  Inventory is what fills in the Fleet Manager node detail views. The resource data sync then aggregates
  it into S3 so it can be queried with Athena; leaving `bucket_name` empty sends it to the audit bucket
  this module already manages, and the required bucket policy statements and KMS grants are added for you.

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      inventory:
        enabled: true
        schedule: "rate(12 hours)"
        max_concurrency: "10%"
        max_errors: "5%"
      resource_data_sync:
        enabled: true
        prefix: "inventory"
  ```

  Two things to know before turning Inventory on:

  - **One apply-all association per account.** Systems Manager allows only one inventory association that
    targets every node, so in an account that already has one — Quick Setup and the console both create
    one — the apply fails with `Multiple apply all associations with document
    'AWS-GatherSoftwareInventory' are not supported`. Find it with
    `aws ssm list-associations --association-filter-list key=AssociationName,value=InventoryAssociation`
    (or list all and look for the document name), then either import it, delete it, or leave
    `inventory.enabled` at `false` and keep using the existing one. Targeting by tag instead of the
    default apply-all also avoids the collision.
  - **The audit lifecycle rule is scoped to `settings.audit.s3_key_prefix`.** Session logs still transition
    and expire on schedule; Inventory data sharing the bucket stays in STANDARD so it remains queryable.

  Narrow the collection with targets and per-category toggles:

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      inventory:
        enabled: true
        targets:
          - key: "tag:Environment"
            values: ["production"]
        windows_updates: "Disabled"
        windows_roles: "Disabled"
        services: "Disabled"
        files: '[{"Path":"/usr/bin","Pattern":["*ssm*"],"Recursive":false}]'
  ```

  ### Recording Remote Desktop connections

  > **Prerequisite: just-in-time node access must already be enabled.** RDP recording is a just-in-time
  > node access feature, not a standalone Fleet Manager one. Just-in-time node access is enabled from the
  > Systems Manager console in the Organizations delegated administrator account (**Just-in-time node
  > access → Enable the new experience**), depends on the unified Systems Manager console, and is billed
  > after a 30 day trial. No API, CloudFormation resource or Terraform provider can turn it on, so this
  > module cannot do it for you. Enabling recording without it fails asynchronously with
  > `403 Just-in-time node access is not enabled`, which is why the module makes you confirm the
  > prerequisite explicitly with `just_in_time_node_access_enabled`.

  Records Fleet Manager RDP connections to S3. Leaving `bucket_name` empty sends them to the audit bucket
  this module already manages, and the `ssm-guiconnect` bucket policy statement and KMS grant are added
  for you. The module also tags the KMS key `SystemsManagerJustInTimeNodeAccessManaged=true`, without
  which operators cannot obtain the `kms:CreateGrant` permission a recorded connection needs.

  ```yaml
  settings:
    kms:
      enabled: true
    fleet_manager:
      enabled: true
      remote_desktop:
        recording:
          enabled: true
          just_in_time_node_access_enabled: true   # confirms you have already enabled it in the console
  ```

  Recording requires a symmetric, encrypt/decrypt customer managed key; the key this module creates
  qualifies. To send recordings elsewhere, name the bucket and take on its policy yourself:

  ```yaml
  settings:
    fleet_manager:
      enabled: true
      remote_desktop:
        recording:
          enabled: true
          bucket_name: "my-central-rdp-recordings"
          bucket_owner: "123456789012"
          kms_key_arn: "arn:aws:kms:us-east-1:123456789012:key/abcd1234-..."
  ```

  Three things to know:

  - **This is the only Remote Desktop setting there is.** Connection duration, idle timeout and
    concurrency are fixed service behaviours, and everything else about an RDP session comes from the
    Session Manager preferences under `settings.session`.
  - **Recordings are not covered by the audit lifecycle rule.** The preferences schema carries no key
    prefix, so the module cannot scope a rule to them; video recordings will accumulate until you add
    your own lifecycle policy.
  - **Operators need their own permissions.** Configuring recording requires
    `ssm-guiconnect:UpdateConnectionRecordingPreferences` and `kms:CreateGrant`; connecting requires
    `ssm-guiconnect:StartConnection` and `kms:CreateGrant` on the recording key. This module grants
    neither — they belong to the human or role making the connection. The module does tag the KMS key it
    creates with `SystemsManagerJustInTimeNodeAccessManaged=true`, which AWS requires before an operator
    can be granted `kms:CreateGrant` on it. Supply that tag yourself if you bring your own key.

  ### Quick Setup host management and patch scanning for the whole account

  Targets every instance in this account and Region. `target_type: "*"` is the local-account form; no
  organizational units are involved, so this can be applied from any account.

  ```yaml
  settings:
    host_management:
      enabled: true
      target_type: "*"
      update_ssm_agent: true
      collect_inventory: true
      scan_instances: true
      install_cloudwatch_agent: true

    patch:
      enabled: true
      target_type: "*"
      operation: "Scan"
      scan_value: "cron(0 1 * * ? *)"
  ```

  Note that `host_management.collect_inventory` and `settings.fleet_manager.inventory` both create an
  inventory association, and Systems Manager permits only one per node. Pick whichever fits — the Quick
  Setup block for a fleet-wide rollout, the Fleet Manager block when the association needs its own
  schedule, targets or collection categories.

  ### Quick Setup patch policy that installs, targeted by tag

  ```yaml
  settings:
    patch:
      enabled: true
      policy_name: "prod-linux-patching"
      operation: "ScanAndInstall"
      scan_value: "cron(0 1 * * ? *)"
      install_value: "cron(0 3 ? * SUN *)"
      reboot_option: "RebootIfNeeded"
      rate_control_concurrency: "10%"
      rate_control_error_threshold: "2%"
      target_type: "Tags"
      target_tag_key: "PatchGroup"
      target_tag_value: "production"
  ```

  `operation` accepts only `Scan` and `ScanAndInstall`. The install schedule is sent to AWS solely under
  `ScanAndInstall`, and falls back to `scan_value` when `install_value` is omitted.

  ### Quick Setup across organizational units

  Applied from the Quick Setup delegated administrator account. `target_type` is left unset — supplying it
  alongside `target_organizational_units` is rejected.

  ```yaml
  settings:
    dhmc:
      enabled: true
      target_organizational_units: "ou-abcd-11111111,ou-abcd-22222222"
      target_regions: "us-east-1,us-west-2"

    host_management:
      enabled: true
      target_organizational_units: "ou-abcd-11111111,ou-abcd-22222222"
      target_regions: "us-east-1,us-west-2"
      collect_inventory: true
  ```

  ### Delegation mode

  Applied against the Organizations management account. Creates only the delegated administrator
  registrations for SSM, SSM Quick Setup, CloudFormation StackSets and Resource Explorer.

  ```yaml
  settings:
    organization:
      delegated: true
      account_id: "123456789012"
  ```

# How to get started quickly
quickstart: |-
  1. Create the deployment directory and run `terragrunt scaffold github.com/cloudopsworks/terraform-module-aws-ssm-session-management` inside it.
  2. Edit `inputs.yaml`; the defaults are usable as-is for a first deployment.
  3. Add the instance roles that will write session logs under `settings.allowed_iam_role_names`, or turn on
     `settings.fleet_manager.default_host_management` to adopt the fleet without instance profiles instead.
     To roll the same adoption out across organizational units, use `settings.dhmc` instead, and add
     `settings.host_management` or `settings.patch` for agent updates, inventory and patching.
  4. Run `terragrunt plan` to review the resources to be created.
  5. Run `terragrunt apply` to deploy the configuration.

